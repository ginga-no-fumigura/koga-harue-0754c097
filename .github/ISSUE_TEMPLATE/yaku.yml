name: 大意の誤り
description: 大意の誤りや、よりよい大意を知らせる
title: "[訳] 古賀春江 詩篇（『画家の詩、詩人の絵 絵は詩のごとく、詩は絵のごとく』より） "
labels: ["訳"]
body:
  - type: input
    id: block
    attributes:
      label: 段落ID
      description: "行頭にある ID（例: koga-harue-0754c097-000001）"
    validations:
      required: true
  - type: textarea
    id: before
    attributes:
      label: いまの大意
    validations:
      required: true
  - type: textarea
    id: after
    attributes:
      label: 直した大意
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: 理由・根拠
